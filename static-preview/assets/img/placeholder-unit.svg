<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Ilustrasi bolen pisang">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7EC"/>
      <stop offset="1" stop-color="#F3E4D1"/>
    </linearGradient>
    <linearGradient id="pastry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B878"/>
      <stop offset="0.55" stop-color="#D29A55"/>
      <stop offset="1" stop-color="#B87A3C"/>
    </linearGradient>
    <linearGradient id="pastry2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C68B"/>
      <stop offset="1" stop-color="#C68B4B"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFE1CF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#4B3028" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="150" cy="180" r="150" fill="#C58A52" opacity="0.10"/>
  <circle cx="690" cy="820" r="190" fill="#7D806A" opacity="0.12"/>

  <g filter="url(#soft)">
    <ellipse cx="400" cy="640" rx="300" ry="130" fill="#4B3028" opacity="0.08"/>
    <ellipse cx="400" cy="610" rx="280" ry="118" fill="url(#plate)"/>
    <ellipse cx="400" cy="605" rx="238" ry="96" fill="#FFF7EC"/>
  </g>

  <g transform="translate(400 560)">
    <g filter="url(#soft)">
      <path d="M-172 24 C-172 -48 -120 -96 -46 -96 C28 -96 92 -58 128 -6 C158 38 120 80 42 80 C-56 80 -172 92 -172 24 Z" fill="url(#pastry)"/>
      <path d="M-150 -6 C-110 -62 -40 -70 20 -44 C-30 -20 -100 6 -150 30 Z" fill="#F4CE9B" opacity="0.55"/>
      <path d="M-120 44 C-40 18 44 20 104 52" stroke="#8C5A2B" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.35"/>
      <path d="M-96 -58 C-30 -78 40 -58 86 -20" stroke="#FFF1DC" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.5"/>
    </g>

    <g transform="translate(150 -40) rotate(14)" filter="url(#soft)">
      <path d="M-118 18 C-118 -36 -82 -68 -26 -68 C20 -68 66 -42 92 -4 C114 28 86 58 30 58 C-40 58 -118 66 -118 18 Z" fill="url(#pastry2)"/>
      <path d="M-94 -4 C-64 -44 -16 -50 24 -30 C-12 -12 -60 6 -96 24 Z" fill="#FFF1DC" opacity="0.55"/>
      <path d="M-70 50 C-14 32 42 34 80 54" stroke="#8C5A2B" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.32"/>
    </g>

    <g transform="translate(-120 70) rotate(-10)" filter="url(#soft)">
      <path d="M-100 14 C-100 -30 -70 -58 -22 -58 C14 -58 48 -36 68 -4 C86 24 64 50 20 50 C-34 50 -100 56 -100 14 Z" fill="url(#pastry)"/>
      <path d="M-80 -6 C-56 -38 -18 -42 10 -26 C-18 -10 -54 6 -82 20 Z" fill="#F8DDB6" opacity="0.5"/>
    </g>
  </g>

  <g stroke="#4B3028" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.28">
    <path d="M120 300 q26 -34 52 0"/>
    <path d="M700 250 q-22 -30 -46 0"/>
    <path d="M660 380 q22 30 46 0"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)" opacity="0.5"/>
</svg>
