<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Ilustrasi kotak hampers BaleBolen">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E9D8"/>
      <stop offset="1" stop-color="#FFF7EC"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B3A30"/>
      <stop offset="1" stop-color="#3B251F"/>
    </linearGradient>
    <linearGradient id="boxLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6C463A"/>
      <stop offset="1" stop-color="#4B3028"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBA268"/>
      <stop offset="1" stop-color="#C58A52"/>
    </linearGradient>
    <linearGradient id="bolen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBC089"/>
      <stop offset="1" stop-color="#C48A48"/>
    </linearGradient>
    <filter id="shadow2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#2D211D" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg2)"/>
  <circle cx="660" cy="200" r="160" fill="#C58A52" opacity="0.12"/>
  <circle cx="140" cy="800" r="180" fill="#7D806A" opacity="0.14"/>

  <!-- daun dekoratif -->
  <g stroke="#7D806A" stroke-width="6" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M150 470 C120 400 150 330 220 300"/>
    <path d="M180 420 C150 410 132 380 138 352"/>
    <path d="M196 372 C190 340 210 312 240 300"/>
    <path d="M650 520 C690 450 670 370 600 340"/>
    <path d="M640 470 C676 460 694 430 688 402"/>
  </g>

  <g filter="url(#shadow2)">
    <!-- isi bolen -->
    <g>
      <ellipse cx="290" cy="360" rx="86" ry="52" fill="url(#bolen)"/>
      <ellipse cx="400" cy="330" rx="86" ry="52" fill="url(#bolen)"/>
      <ellipse cx="510" cy="360" rx="86" ry="52" fill="url(#bolen)"/>
      <path d="M250 350 q40 -34 80 0" stroke="#FFF1DC" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M360 320 q40 -34 80 0" stroke="#FFF1DC" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M470 350 q40 -34 80 0" stroke="#FFF1DC" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round"/>
    </g>

    <!-- kotak -->
    <path d="M170 470 H630 L600 830 H200 Z" fill="url(#box)"/>
    <path d="M150 410 H650 L630 500 H170 Z" fill="url(#boxLid)"/>
    <path d="M240 500 H560 L548 560 H252 Z" fill="#2F1F1A" opacity="0.35"/>

    <!-- pita vertikal & horizontal -->
    <rect x="376" y="410" width="48" height="420" fill="url(#ribbon)"/>
    <rect x="150" y="446" width="500" height="44" fill="url(#ribbon)"/>
    <path d="M400 446 l-70 -60 c-26 -22 2 -60 34 -42 l36 30 36 -30 c32 -18 60 20 34 42 Z" fill="url(#ribbon)"/>
    <circle cx="400" cy="446" r="20" fill="#B0743B"/>

    <!-- kartu ucapan -->
    <g transform="translate(470 640) rotate(6)">
      <rect width="190" height="130" rx="10" fill="#FFF7EC"/>
      <rect x="10" y="10" width="170" height="110" rx="6" fill="none" stroke="#E9DDCE"/>
      <path d="M30 48 H160 M30 72 H140 M30 96 H100" stroke="#C58A52" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <rect width="800" height="1000" fill="#4B3028" opacity="0.015"/>
</svg>
